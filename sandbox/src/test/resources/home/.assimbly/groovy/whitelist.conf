# Whitelist rule syntax:
#
# Format:
#   <class-or-package>#<methods>
#
# Exact class:
#   java.lang.String#*
#   -> allow all methods on String
#
# Exact class with denied methods:
#   java.util.List#*,-clear,-removeAll
#   -> allow all except clear and removeAll
#
# Exact class with allowed methods only:
#   java.lang.Math#max,min
#   -> allow only max and min
#
# Package:
#   java.lang.*#*
#   -> allow all methods on all classes in java.lang package
#
# Package rules do not include sub-packages.
#
# Package including sub-packages:
#   groovy.xml.**#*
#   -> allow all methods on all classes in groovy.xml and its sub-packages
#
# Notes:
#   *  = allow all methods
#   -x = deny method x when using *

